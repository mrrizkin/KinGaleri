# Flatpak manifest for Kin Galeri (PRD 4.4 / 9).
#
# Build (needs flatpak-builder, not just the flatpak CLI):
#   flatpak install flathub org.kde.Sdk//6.8 org.kde.Platform//6.8
#   flatpak-builder --user --install --force-clean build-flatpak \
#       packaging/flatpak/io.github.mrrizkin.KinGaleri.yml
#
# The KDE runtime is used because it already ships Qt 6 Quick/Sql/Multimedia
# (FFmpeg backend) and the image/video codecs, so the bundle stays small. libmpv
# is *not* part of the runtime, hence the mpv backend is disabled and playback
# goes through Qt Multimedia's FFmpeg backend, which is the PRD 10.1 default
# anyway.
app-id: io.github.mrrizkin.KinGaleri
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: kin-galeri

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The whole point of the app is reading the user's photos, so home access is
  # the default. Narrow it to xdg-pictures if you prefer.
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  # ONNX Runtime, for face grouping. The KDE runtime does not carry it and Flathub
  # has no module for the version this project is tested against, so the official
  # CPU build is pinned by tag and sha256 - literally the same file the AppImage
  # and the AUR package build against, which keeps the three consistent.
  #
  # The paths are discovered with `find` instead of being written out, because
  # whether flatpak-builder strips the archive's single top-level directory is an
  # implementation detail we would rather not depend on.
  - name: onnxruntime
    buildsystem: simple
    build-commands:
      - install -d /app/lib /app/include
      - |
        set -e
        inc="$(dirname "$(find . -name onnxruntime_cxx_api.h -print -quit)")"
        lib="$(dirname "$(find . -name 'libonnxruntime.so' -print -quit)")"
        cp -a "$inc/." /app/include/
        cp -a "$lib/." /app/lib/
    sources:
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
        sha256: 67db4dc1561f1e3fd42e619575c82c601ef89849afc7ea85a003abbac1a1a105

  - name: kin-galeri
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DKG_BUILD_TESTS=OFF
      - -DKG_ENABLE_MPV=OFF
      - -DKG_VIDEO_BACKEND=qtmultimedia
      # Face grouping, against the module above. KG_ENABLE_ML now fails the build
      # rather than quietly dropping the feature, so a typo here cannot ship a
      # bundle without it.
      - -DKG_ENABLE_ML=ON
      - -DKG_ORT_ROOT=/app
    sources:
      - type: dir
        path: ../..
