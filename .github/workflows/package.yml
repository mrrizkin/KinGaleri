# Builds the release artifacts (AppImage, .deb, Flatpak, Arch package), smoke
# tests them, and attaches them to a GitHub release when the trigger is a v* tag.
#
# Why the hosts are what they are:
#   * AppImage      -> ubuntu-24.04 runner with Qt 6.8 from aqtinstall. The glibc
#                     baseline for AppImages is the oldest distro we want to
#                     support, and Ubuntu 24.04's own Qt is 6.4.2 (below the
#                     project minimum), so Qt is installed next to it instead of
#                     taken from the distro.
#   * .deb          -> Debian 13 container; its Qt 6.8.2 is the stack the package
#                     depends on at runtime.
#   * Flatpak       -> KDE 6.8 runtime, which already carries Qt Quick/Sql/
#                     Multimedia and the codecs.
#   * Arch package  -> archlinux:base-devel, built with makepkg as a non-root user
#                     because makepkg refuses to run as root.
#
# DoD note: PRD §9 asks for an AppImage that runs on Ubuntu 24.04 *and* Fedora 40
# with no manual dependencies. Only that pair of containers proves it, so the
# smoke job runs the artifact in both.
name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Nested AppImages (linuxdeploy and its Qt plugin) otherwise need FUSE, which
  # the GitHub runners do not have.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  # ---------------------------------------------------------------------------
  # AppImage
  # ---------------------------------------------------------------------------
  appimage:
    name: AppImage (Qt 6.8 on Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The list is mostly build inputs, but it also has to contain the runtime
          # dependencies of the libraries linuxdeploy resolves: QtMultimedia links
          # libpulse, and FFmpeg's plugin links the audio stack. Without them
          # deployment stops at "ERROR: Could not find dependency: libpulse.so.0".
          # libmpv comes from Ubuntu here. mpvqt - the Qt wrapper this app
          # actually drives mpv through - is not packaged for 24.04, and the
          # extra-cmake-modules it needs is 5.115 there (it wants >= 6.0), so both
          # are built from pinned upstream sources in the next step.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsqlite3-dev libgl1-mesa-dev libegl1-mesa-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-xcb-dev libxcb-cursor-dev libxcb-icccm4-dev \
            libxcb-keysyms1-dev libxcb-shape0-dev \
            libpulse0 libasound2t64 libsndfile1 libasyncns0 \
            libmpv-dev \
            patchelf file wget curl python3-pip
          # A modern AppImage toolchain still probes FUSE on some paths; the
          # t64-suffixed name is the one Ubuntu 24.04 uses.
          sudo apt-get install -y --no-install-recommends libfuse2t64 || true

      - name: Install Qt 6.8 (aqtinstall)
        run: |
          python3 -m pip install --user --break-system-packages aqtinstall
          # Only genuinely optional modules are listed: qtsvg and qttools ship
          # inside the base linux_gcc_64 archive and asking for them again makes
          # aqt abort with "packages not found".
          "$HOME/.local/bin/aqt" install-qt linux desktop 6.8.0 linux_gcc_64 \
            -m qtmultimedia qtimageformats -O "$HOME/Qt"
          echo "$HOME/Qt/6.8.0/gcc_64/bin" >> "$GITHUB_PATH"

      # ONNX Runtime powers face grouping and is not something the runner has, so
      # it comes from the pinned upstream archive - the same tag and sha256 the
      # Flatpak manifest and the PKGBUILD use, which is what makes the three
      # builds comparable.
      - name: Install ONNX Runtime
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/build-tools"
          curl -fL --retry 3 -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          echo "67db4dc1561f1e3fd42e619575c82c601ef89849afc7ea85a003abbac1a1a105  /tmp/ort.tgz" | sha256sum -c -
          tar -xzf /tmp/ort.tgz -C "$GITHUB_WORKSPACE/build-tools"
          echo "ORT_ROOT=$GITHUB_WORKSPACE/build-tools/onnxruntime-linux-x64-1.20.1" >> "$GITHUB_ENV"

      # Debian 13, Fedora and Arch all package mpvqt; Ubuntu 24.04 does not, so it
      # is built from upstream along with the ECM it requires. Neither is
      # statically linked: libmpv comes from the distribution and libMpvQt is
      # linked dynamically, which is also the simpler LGPL arrangement (static
      # linking would drag in the relinking obligation).
      #
      # 1.1.0 and not 1.2.0: 1.2.0's mpvrenderer.cpp opens with
      # Q_STATIC_LOGGING_CATEGORY, which the Qt 6.8 headers do not define, and it
      # is what Haruna's Flathub build compiles against Qt 6.11. 1.1.0 is the
      # version Debian ships, so the AppImage and the .deb build the same code.
      - name: Build mpvqt
        run: |
          set -eux
          tools="$GITHUB_WORKSPACE/build-tools"
          mkdir -p "$tools"
          curl -fL --retry 3 -o /tmp/ecm.tar.xz \
            https://download.kde.org/stable/frameworks/6.15/extra-cmake-modules-6.15.0.tar.xz
          echo "f7cd022095a9e6bdbe5897720a24bfda81d211757b7c08b173061962bf2ee0b2  /tmp/ecm.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ecm.tar.xz -C "$tools"
          curl -fL --retry 3 -o /tmp/mpvqt.tar.xz \
            https://download.kde.org/stable/mpvqt/mpvqt-1.1.0.tar.xz
          echo "cd7a7c58b816e42bcbc0980bfe06062d6cf87f5254962ac6940f6d5f86fd0f71  /tmp/mpvqt.tar.xz" | sha256sum -c -
          tar -xJf /tmp/mpvqt.tar.xz -C "$tools"

          cmake -S "$tools/extra-cmake-modules-6.15.0" -B /tmp/ecm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$tools/ecm" \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/ecm-build
          cmake --install /tmp/ecm-build

          cmake -S "$tools/mpvqt-1.1.0" -B /tmp/mpvqt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$tools/mpvqt" \
            -DCMAKE_PREFIX_PATH="$tools/ecm;$HOME/Qt/6.8.0/gcc_64" \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/mpvqt-build
          cmake --install /tmp/mpvqt-build

          echo "MPVQT_PREFIX=$tools/mpvqt" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: packaging/appimage/build.sh
        env:
          # aqtinstall's Qt ships the MySQL/PostgreSQL/ODBC SQL drivers, whose
          # client libraries the runner does not have; see the script's comment.
          PRUNE_QT_SQLDRIVERS: '1'
          # ...and the GStreamer multimedia backend, which is never selected but
          # would need the whole GStreamer stack to be deployable.
          PRUNE_QT_GSTREAMER: '1'
          CMAKE_ARGS: "-DKG_ENABLE_ML=ON -DKG_ORT_ROOT=${{ env.ORT_ROOT }} -DKG_ENABLE_MPV=ON -DCMAKE_PREFIX_PATH=${{ env.MPVQT_PREFIX }}"
          # libmpv comes from the Ubuntu package and is already on the loader
          # path; libMpvQt was just installed into a prefix the loader does not
          # know, and linuxdeploy resolves DT_NEEDED entries with the loader.
          KG_MPV_LIB_DIR: ${{ env.MPVQT_PREFIX }}/lib

      # The version line names the build's optional features, so it is also the
      # cheapest way to prove this AppImage was not built without them.
      - name: Confirm the optional features are really in the binary
        run: |
          set -eux
          ./build-appimage/kin-galeri --version | grep 'ml: on'
          ./build-appimage/kin-galeri --version | grep 'video: mpv'
          ./build-appimage/kin-galeri --version

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Kin_Galeri*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # AppImage smoke test - the actual DoD claim
  # ---------------------------------------------------------------------------
  smoke-appimage:
    name: AppImage smoke test (${{ matrix.image }})
    needs: [appimage]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'fedora:40']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage

      # An AppImage is not self-contained: by design it bundles the Qt runtime
      # and the application, but it relies on the base system for libc, X11,
      # OpenGL, the font stack and the audio stack. linuxdeploy deliberately
      # refuses to bundle those (it calls them "system libraries"), so a bare
      # `ubuntu:24.04` image fails on libGLX.so.0 / libfontconfig.so.1 before Qt
      # is even reached. ALSA is in the same category: libmpv links libasound
      # directly, and bundling a host's ALSA in an AppImage is exactly what you
      # must not do, because it has to match the machine's audio setup.
      #
      # That is the expected contract, and every desktop install of Ubuntu or
      # Fedora already satisfies it - so the smoke test installs exactly that
      # baseline (no Qt packages, nothing from the app's own dependency list) and
      # then checks that the bundle carries everything else itself. If this step
      # ever needs a `libqt6*` package, the AppImage is genuinely broken.
      - name: Install the desktop baseline (not the app's dependencies)
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              libglx0 libopengl0 libegl1 libgl1 \
              libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libdbus-1-3 \
              libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
              libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render0 libxcb-shm0 \
              libxcb-xfixes0 libxcb-image0 libxcb-randr0 libxcb-sync1 libxcb-xkb1 \
              libxrender1 libsm6 libice6 libglib2.0-0 \
              libasound2t64 \
              libjack-jackd2-0 libpipewire-0.3-0 libusb-1.0-0
          else
            dnf install -y -q --setopt=install_weak_deps=False \
              libglvnd-glx libglvnd-opengl libglvnd-egl mesa-libGL \
              fontconfig freetype harfbuzz fribidi dbus-libs \
              libX11 libX11-xcb libxcb libxkbcommon libxkbcommon-x11 \
              xcb-util-cursor xcb-util-keysyms xcb-util-image libXrender libSM libICE glib2 \
              alsa-lib \
              pipewire-jack-audio-connection-kit pipewire-libs libusb1
          fi

      # `--no-ui` never loads QML, so on its own it cannot catch a missing QML
      # module or a QML file that no longer compiles - which is exactly how the
      # .deb shipped without any QML modules and how a non-loadable video surface
      # went unnoticed. So: check the bundle really carries the Qt Multimedia
      # module the video surface imports, then run the real GUI against the
      # offscreen platform and fail on engine errors.
      - name: Check the QML modules and run the GUI offscreen
        run: |
          set -x
          # The artifact upload does not preserve the executable bit.
          chmod +x Kin_Galeri*.AppImage
          ./Kin_Galeri*.AppImage --appimage-extract >/dev/null
          ls squashfs-root/usr/qml/QtMultimedia/qmldir
          ls squashfs-root/usr/plugins/multimedia/
          ls squashfs-root/usr/lib/libQt6Multimedia.so.6*
          # Face grouping: the ONNX Runtime library has to be inside the bundle,
          # since no target desktop ships a compatible one.
          ls squashfs-root/usr/lib/libonnxruntime.so.1*
          ls squashfs-root/usr/plugins/iconengines/
          # mpv: both are real DT_NEEDED entries, so linuxdeploy resolves them -
          # this asserts that it did, and that the build did not quietly fall back
          # to Qt Multimedia the way it used to when MpvQt was not found.
          ls squashfs-root/usr/lib/libMpvQt.so.1*
          ls squashfs-root/usr/lib/libmpv.so.2*
          timeout 12 ./Kin_Galeri*.AppImage --appimage-extract-and-run \
            --no-home-scan --db /tmp/gui.db --cache /tmp/gui-cache > /tmp/gui.log 2>&1 || true
          # Print the log unconditionally: when this step fails, the log is the only
          # thing that says why, and an empty log plus a missing database means the
          # process died before it could write anything - i.e. at load time.
          cat /tmp/gui.log || true
          if [ ! -s /tmp/gui.db ]; then
            echo "::error::the GUI never created its database - see the log above"
            LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" \
              ldd squashfs-root/usr/bin/kin-galeri | grep -i 'not found' || true
            exit 1
          fi
          ./Kin_Galeri*.AppImage --appimage-extract-and-run --version | grep 'ml: on'
          ./Kin_Galeri*.AppImage --appimage-extract-and-run --version | grep 'video: mpv'
          ! grep -E "is not installed|was not found|not a type|Driver not loaded|Cannot assign to non-existent|QQmlApplicationEngine failed" /tmp/gui.log
        env:
          # The bundle carries the offscreen platform plugin, but the platform has
          # to be named: without a $DISPLAY Qt would pick xcb and abort.
          QT_QPA_PLATFORM: offscreen

      # `--appimage-extract-and-run` needs no FUSE; `--no-ui` keeps it headless,
      # and the offscreen platform (bundled by packaging/appimage/build.sh) means
      # no X server either. This is what proves the bundle carries the Qt runtime,
      # the QML modules and the plugins.
      - name: Run headless
        run: |
          set -x
          chmod +x Kin_Galeri*.AppImage
          ./Kin_Galeri*.AppImage --appimage-extract-and-run \
            --no-ui --no-home-scan \
            --db /tmp/smoke.db --cache /tmp/smoke-cache
          test -s /tmp/smoke.db
          ./Kin_Galeri*.AppImage --appimage-extract-and-run --version
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg

  # ---------------------------------------------------------------------------
  # .deb (Debian 13)
  # ---------------------------------------------------------------------------
  deb:
    name: .deb (Debian 13)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ca-certificates \
            pkg-config libsqlite3-dev \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-svg-dev qt6-multimedia-dev qt6-l10n-tools \
            libonnxruntime-dev \
            libmpv-dev libmpvqt-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            dpkg-dev fakeroot file desktop-file-utils appstream

      - name: Build .deb
        run: packaging/deb/build-deb.sh
        env:
          # Debian 13 packages both mpvqt (libmpvqt-dev) and libmpv, so this
          # package links the distribution's copies and just declares them as
          # dependencies - no vendoring, unlike the AppImage.
          # Face grouping is ON: Debian 13 ships libonnxruntime1.21 and its headers,
          # so this package links the distro library and depends on it, rather than
          # shipping a private copy like the AppImage and the Flatpak have to.
          CMAKE_ARGS: "-DKG_ENABLE_MPV=ON -DKG_ENABLE_ML=ON"

      # NOT installed here on purpose. This container has qt6-base-dev and friends,
      # which provide every plugin and QML module the app loads at runtime, so an
      # incomplete Depends line would stay invisible. The `deb-install` job below
      # installs the artifact into a bare debian:trixie instead.

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/kin-galeri_*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # .deb install test in a clean container
  #
  # This is the job that caught the real bug: the first .deb built fine, installed
  # fine and even printed --version, because it was tested next to the Qt
  # development packages. What it could not do was run - the QSQLITE driver, the
  # SVG plugin and every QML module reach the app through dlopen, so no
  # dpkg-shlibdeps run can see that they are missing from Depends.
  #
  # So: start from a bare debian:trixie, install only what the package declares,
  # and assert that the runtime plugins and QML modules all arrived that way.
  # ---------------------------------------------------------------------------
  deb-install:
    name: .deb install test (clean Debian 13)
    needs: [deb]
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb

      - name: Nothing Qt may be present yet
        run: |
          set -eux
          if dpkg -l | grep -E '^ii[[:space:]]+libqt6'; then
            echo "::error::Qt is already installed in this container, so this test proves nothing"
            exit 1
          fi

      - name: Install the package and its declared dependencies
        run: |
          set -eux
          apt-get update
          # Validators for the shipped desktop/metainfo files, not application
          # dependencies - and the assertion after them proves neither pulls in Qt.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            desktop-file-utils appstream
          ! dpkg -l | grep -qE '^ii[[:space:]]+libqt6'
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ./kin-galeri_*_amd64.deb

      - name: The plugins and QML modules must have come from the dependencies
        run: |
          set -eux
          QTPLUG=/usr/lib/x86_64-linux-gnu/qt6/plugins
          QMLDIR=/usr/lib/x86_64-linux-gnu/qt6/qml
          ls $QTPLUG/sqldrivers/libqsqlite.so
          ls $QTPLUG/imageformats/libqsvg.so
          ls $QTPLUG/iconengines/libqsvgicon.so
          ls $QTPLUG/multimedia/
          ls $QMLDIR/QtQuick/Controls/qmldir
          ls $QMLDIR/QtMultimedia/qmldir
          # Face grouping: the driver comes in as a real dependency, because the
          # binary links it directly.
          ls /usr/lib/x86_64-linux-gnu/libonnxruntime.so.1.21
          dpkg -s kin-galeri | grep -E '^Depends:.*libonnxruntime1.21'
          # mpv: the wrapper is a DT_NEEDED entry, so dpkg-shlibdeps derives it.
          # libmpv is deliberately absent from Depends - the app never calls mpv's
          # API directly, so --as-needed drops it and it arrives transitively via
          # libmpvqt1; the ls above is what proves it is really installed.
          ls /usr/lib/x86_64-linux-gnu/libMpvQt.so.1
          ls /usr/lib/x86_64-linux-gnu/libmpv.so.2
          dpkg -s kin-galeri | grep -E '^Depends:.*libmpvqt1'

      - name: Headless run
        run: |
          set -eux
          QT_QPA_PLATFORM=offscreen kin-galeri --no-ui --no-home-scan \
            --db /tmp/deb-clean.db --cache /tmp/deb-clean-cache
          test -s /tmp/deb-clean.db
          # No QT_QPA_PLATFORM on purpose: --version has to work without a display.
          kin-galeri --version | grep 'ml: on'
          kin-galeri --version | grep 'video: mpv'
          kin-galeri --version

      # --no-ui never loads QML, so it cannot catch a missing module or a QML file
      # that no longer compiles. Run the real GUI offscreen and check the shipped
      # metadata while we are here.
      - name: GUI offscreen run and metadata validation
        env:
          # The GUI needs a platform plugin. Here it is Qt's own offscreen plugin
          # from the distro package - the point of this step is the QML, not the
          # display. (The `--version` check above deliberately has no platform, to
          # prove it works without one.)
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eux
          timeout 12 kin-galeri --no-home-scan \
            --db /tmp/gui.db --cache /tmp/gui-cache > /tmp/gui.log 2>&1 || true
          test -s /tmp/gui.db
          ! grep -E "is not installed|was not found|not a type|Driver not loaded|Cannot assign to non-existent|QQmlApplicationEngine failed" /tmp/gui.log
          desktop-file-validate /usr/share/applications/io.github.mrrizkin.KinGaleri.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.mrrizkin.KinGaleri.metainfo.xml

  # ---------------------------------------------------------------------------
  # Flatpak (KDE 6.8 runtime)
  # ---------------------------------------------------------------------------
  flatpak:
    name: Flatpak (org.kde.Platform 6.8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # elfutils provides eu-strip, which flatpak-builder needs to compress
          # debuginfo. librsvg2-common provides the SVG rasterizer that
          # `appstreamcli compose` needs; without it the export step fails with
          # "Unrecognized image file format" on a perfectly valid SVG icon, while
          # `appstreamcli validate` still reports the metadata as fine.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common

      - name: Build bundle
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --repo=repo \
            --install-deps-from=flathub \
            build-flatpak packaging/flatpak/io.github.mrrizkin.KinGaleri.yml
          flatpak build-bundle repo KinGaleri.flatpak io.github.mrrizkin.KinGaleri

      # The build itself now fails if face grouping cannot be configured, so this
      # only has to prove the library ended up in the bundle's /app - the runtime
      # failure mode (installs fine, cannot load its library) is the one that
      # cannot be seen from a successful build.
      - name: Confirm face grouping is inside the bundle
        run: |
          set -eux
          test -f build-flatpak/files/lib/libonnxruntime.so.1
          test -f build-flatpak/files/lib/libonnxruntime.so.1.20.1

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: KinGaleri.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Arch package (also what AUR's kin-galeri-git builds)
  # ---------------------------------------------------------------------------
  arch:
    name: Arch package (makepkg)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      # makepkg refuses to run as root, so the build happens as a normal user.
      # `makepkg -s` resolves depends/makedepends through pacman, which is why
      # that user gets passwordless sudo; the alternative would be duplicating the
      # dependency list here and letting it drift from the PKGBUILD.
      - name: Build package
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r packaging/arch /home/builder/arch
          chown -R builder:builder /home/builder
          su builder -c 'cd /home/builder/arch && makepkg -sf --noconfirm' </dev/null
          # The -debug package is ~12 MB and nothing consumes it; the release only
          # needs the real one.
          rm -f /home/builder/arch/*-debug-*.pkg.tar.zst

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: arch
          # makepkg writes next to its PKGBUILD, which lives in the builder's home
          # (makepkg refuses to run as root, and the workspace is root-owned).
          path: /home/builder/arch/*.pkg.tar.zst
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    name: Attach artifacts to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, smoke-appimage, deb, deb-install, flatpak, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show what will be published
        run: find dist -type f -printf '%P  %s bytes\n' | sort

      # The AppImage is ~100 MB and the release is the only place the checksums
      # can come from, so generate them here rather than after the fact.
      - name: Write checksums
        run: |
          set -eux
          cd dist
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          sha256sum -c --quiet SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kin Galeri $GITHUB_REF_NAME" \
            --generate-notes \
