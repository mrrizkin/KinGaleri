# qmllint settings for the hand-written QML under src/ui/qml/.
#
# Canonical way to run the linter - always the Qt 6 build of qmllint. Note that
# `qt5-declarative` installs a *different* `qmllint` at /usr/bin/qmllint, which
# silently shadows the Qt 6 one on PATH and produces no useful output; the CMake
# target below uses the Qt 6 binary explicitly:
#
#     cmake -S . -B build -G Ninja
#     cmake --build build --target all_qmllint
#
# The settings file is picked up by walking up from each linted file, so it
# applies no matter which directory qmllint is invoked from.
#
# UnqualifiedAccess is switched off repo-wide, and only that category. 241 of
# the warnings this project used to emit were that single category, 183 of them a
# nested component reading the outer `root` id - exactly what
# `pragma ComponentBehavior: Bound` forbids. Migrating is not a one-line pragma:
# an inline delegate cannot receive a `required` property from the view, so each
# delegate would have to move into its own file. Recorded as tracked debt in
# docs/TECH-DEBT-REPORT.md rather than papered over here.
#
# Every other category stays at its default severity. ReadOnlyProperty is the one
# that caught the broken PinchHandler zoom in ViewerOverlay.qml, and it must keep
# working. Files that legitimately cannot be linted (MpvVideoSurface.qml,
# SettingsView.qml, ViewerOverlay.qml) carry narrow `// qmllint disable` comments
# with the reason written next to them.
[Warnings]
UnqualifiedAccess=disable
